<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order placed | Nova Store</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header class="topbar"><a class="brand" href="/">NOVA<span>STORE</span></a><nav><a href="/">Shop</a></nav></header><main class="success-wrap"><div class="success-icon">✓</div><p class="eyebrow">ORDER CONFIRMED</p><h1>Thank you, <span th:text="${customerName}">Customer</span>!</h1><p>Your demo order has been placed successfully.</p><div class="order-ticket"><span>Order number</span><strong th:text="${orderNumber}">ORD-12345</strong><span>Total paid (demo)</span><strong th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹499</strong></div><p class="demo-note">This is a student project demo. No payment was processed and no order was saved to a database.</p><a class="primary-link" href="/">Continue shopping →</a></main><footer><span class="brand">NOVA<span>STORE</span></span><p>Java E-Commerce Demo</p></footer></body></html>
