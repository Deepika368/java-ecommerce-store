<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Nova Store</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header class="topbar"><a class="brand" href="/">NOVA<span>STORE</span></a><nav><a href="/">Shop</a><a href="/cart">Cart <span class="cart-count" th:text="${cartCount}">0</span></a></nav></header>
<main class="page-wrap"><p class="eyebrow">ALMOST YOURS</p><h1 class="page-title">Checkout</h1><div class="checkout-layout"><form class="checkout-form" action="/checkout" method="post"><h2>Delivery details</h2><label>Full name<input name="customerName" required minlength="2" placeholder="Enter your full name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Delivery address<textarea name="address" required rows="4" placeholder="House number, street, city, PIN code"></textarea></label><p class="demo-note">Demo checkout only: no real payment is collected.</p><button class="primary-button wide-button" type="submit">Place demo order</button></form><aside class="summary"><h2>Order summary</h2><div class="summary-line"><span>Items</span><strong th:text="${items.size()}">1</strong></div><div class="summary-line"><span>Delivery</span><strong>Free</strong></div><hr><div class="summary-line total-line"><span>Total</span><strong th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹499</strong></div><a class="back-link" href="/cart">← Back to cart</a></aside></div></main><footer><span class="brand">NOVA<span>STORE</span></span><p>Java E-Commerce Demo</p></footer></body></html>
