<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your Cart | Nova Store</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header class="topbar"><a class="brand" href="/">NOVA<span>STORE</span></a><nav><a href="/">Shop</a><a href="/cart">Cart <span class="cart-count" th:text="${cartCount}">0</span></a></nav></header>
<main class="page-wrap"><p class="eyebrow">YOUR BAG</p><h1 class="page-title">Shopping cart</h1>
<div class="cart-layout" th:if="${!items.isEmpty()}"><section class="cart-list"><article class="cart-item" th:each="item : ${items}"><div class="cart-emoji" th:text="${item.product.emoji}">👕</div><div class="cart-details"><h3 th:text="${item.product.name}">Product</h3><p th:text="${item.product.category}">Category</p><strong th:text="'₹' + ${#numbers.formatDecimal(item.product.price, 1, 2)}">₹499</strong><div class="quantity"><form th:action="@{/cart/decrease/{id}(id=${item.product.id})}" method="post"><button aria-label="Decrease quantity">−</button></form><span th:text="${item.quantity}">1</span><form th:action="@{/cart/increase/{id}(id=${item.product.id})}" method="post"><button aria-label="Increase quantity">+</button></form></div></div><div class="cart-right"><strong th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹499</strong><form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post"><button class="remove-button">Remove</button></form></div></article></section>
<aside class="summary"><h2>Order summary</h2><div class="summary-line"><span>Subtotal</span><strong th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹499</strong></div><div class="summary-line"><span>Delivery</span><strong>Free</strong></div><hr><div class="summary-line total-line"><span>Total</span><strong th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹499</strong></div><a class="primary-link full-link" href="/checkout">Continue to checkout →</a><a class="back-link" href="/">← Continue shopping</a></aside></div>
<div class="empty-state" th:if="${items.isEmpty()}"><div>🛒</div><h2>Your cart is empty</h2><p>Add something you love to get started.</p><a class="primary-link" href="/">Browse products</a></div></main><footer><span class="brand">NOVA<span>STORE</span></span><p>Java E-Commerce Demo</p></footer></body></html>
